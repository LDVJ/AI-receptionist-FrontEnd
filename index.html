<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Receptionsit</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="background">
      <img
        src="/images/hotel-background.png"
        alt="Taj-hotel-img"
        id="background-img"
      />
    </div>
    <div class="chat">
      <div class="chat-header">
        <div class="agent-info">
          <img src="hotel-background.png" alt="profile_pic" id="profile-pic" />
          <h5 class="hotel-name">Taj Hotel</h5>
        </div>
        <div class="chat-functions">
          <i class="fa-solid fa-ellipsis-vertical" id="function-icon"> </i>
          <div id="function-popup" class="function-popup">
            <a href="#">Help</a>
            <a href="#">Feedback</a>
          </div>
        </div>
      </div>
      <div class="demo-container">
        <div class="chat-messages">
          
        </div>
      </div>
      <div class="text-field">
        <input
          type="text"
          name="message-box"
          id="message-box"
          placeholder="Message"
        />
        <button type="submit" id="submit-btn">
          <i class="fa-solid fa-paper-plane submit-icon"></i>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
